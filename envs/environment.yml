# Python environment for the data-access, matching, concordance and figure steps.
#   conda env create -f envs/environment.yml
# (R / Bioconductor packages are managed separately with renv: see renv.lock)
name: cancer-proteogenomics
channels:
  - conda-forge
dependencies:
  - python=3.12.12
  - numpy=2.3.4
  - pandas=2.3.3
  - scipy=1.16.3
  - matplotlib-base=3.10.7
  - seaborn-base=0.13.2
  - statsmodels=0.14.5
  - scikit-learn=1.7.2
  - lifelines=0.30.0
  - requests=2.32.5
  - pyarrow=21.0.0
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - adjusttext=1.3.0
  - upsetplot=0.9.0
  - openpyxl=3.1.5
  - pytest=8.4.2
